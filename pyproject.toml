[project]
name = "tayyab-chatbot"
version = "1.0.0"
description = "Personal RAG-based NLP chatbot using personal dataset, FastEmbed, FAISS, and Gemini."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "faiss-cpu",
    "fastembed",
    "groq",
    "numpy",
    "python-dotenv",
    "streamlit",
]

[tool.uv]
package = false
